name: Publicar no GitHub Pages

# Execução manual (Actions -> "Publicar no GitHub Pages" -> Run workflow).
# Antes: Settings -> Pages -> Source: "GitHub Actions" e, em Settings -> Secrets and variables -> Actions -> Variables,
# crie VITE_SUPABASE_URL e VITE_SUPABASE_ANON_KEY (a chave anon é pública por design).
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build-only
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_ALLOW_SIGNUP: ${{ vars.VITE_ALLOW_SIGNUP }}
          # o site fica em https://<usuario>.github.io/<repositorio>/
          VITE_BASE: /${{ github.event.repository.name }}/
      # SPA no GitHub Pages: rotas desconhecidas devolvem 404.html, que é o próprio app.
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
